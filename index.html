<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BudgetSmart</title>
<link rel="stylesheet" href="style.css?v=1790921643"/>
<link rel="manifest" href="manifest.json"/>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#E8631C,#D98C12);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:20px;padding:36px 28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);">
    <h1 style="font-size:1.9rem;color:#E8631C;text-align:center;margin-bottom:4px;">BudgetSmart</h1>
    <p style="color:#999;text-align:center;margin-bottom:24px;">Gérez vos finances facilement</p>
    <div style="display:flex;gap:6px;background:#f0f0f0;border-radius:12px;padding:5px;margin-bottom:20px;">
      <button id="tabLogin" onclick="showTab('login')" style="flex:1;padding:13px;border-radius:9px;border:none;font-size:1rem;font-weight:800;cursor:pointer;background:#E8631C;color:#fff;">Connexion</button>
      <button id="tabSignup" onclick="showTab('signup')" style="flex:1;padding:13px;border-radius:9px;border:none;font-size:1rem;font-weight:800;cursor:pointer;background:none;color:#999;">Créer un compte</button>
    </div>
    <div id="authErr" style="display:none;background:#fdecea;border:2px solid #f5b0a0;border-radius:10px;padding:12px;color:#c0392b;font-weight:700;margin-bottom:14px;"></div>
    <div id="fLogin">
      <input type="email" id="lEmail" placeholder="Votre email" style="width:100%;padding:14px;border:2px solid #e0d4c0;border-radius:12px;font-size:1rem;margin-bottom:12px;outline:none;display:block;box-sizing:border-box;"/>
      <input type="password" id="lPwd" placeholder="Mot de passe" style="width:100%;padding:14px;border:2px solid #e0d4c0;border-radius:12px;font-size:1rem;margin-bottom:16px;outline:none;display:block;box-sizing:border-box;"/>
      <button onclick="doLogin()" style="width:100%;padding:16px;background:#E8631C;color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:800;cursor:pointer;">Se connecter →</button>
    </div>
    <div id="fSignup" style="display:none;">
      <input type="text" id="sName" placeholder="Votre prénom" style="width:100%;padding:14px;border:2px solid #e0d4c0;border-radius:12px;font-size:1rem;margin-bottom:12px;outline:none;display:block;box-sizing:border-box;"/>
      <input type="email" id="sEmail" placeholder="Votre email" style="width:100%;padding:14px;border:2px solid #e0d4c0;border-radius:12px;font-size:1rem;margin-bottom:12px;outline:none;display:block;box-sizing:border-box;"/>
      <input type="password" id="sPwd" placeholder="Mot de passe (min. 6 caractères)" style="width:100%;padding:14px;border:2px solid #e0d4c0;border-radius:12px;font-size:1rem;margin-bottom:16px;outline:none;display:block;box-sizing:border-box;"/>
      <button onclick="doSignup()" style="width:100%;padding:16px;background:#1F9D6B;color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:800;cursor:pointer;">Créer mon compte ✓</button>
    </div>
  </div>
</div>

<!-- APP (hidden until login) -->
<div id="appContainer" style="display:none;">
  <!-- App content loaded by script.js -->
</div>

<script>
function showTab(t) {
  document.getElementById('fLogin').style.display   = t==='login'  ? 'block':'none';
  document.getElementById('fSignup').style.display  = t==='signup' ? 'block':'none';
  document.getElementById('tabLogin').style.cssText  = 'flex:1;padding:13px;border-radius:9px;border:none;font-size:1rem;font-weight:800;cursor:pointer;' + (t==='login'  ? 'background:#E8631C;color:#fff;' : 'background:none;color:#999;');
  document.getElementById('tabSignup').style.cssText = 'flex:1;padding:13px;border-radius:9px;border:none;font-size:1rem;font-weight:800;cursor:pointer;' + (t==='signup' ? 'background:#E8631C;color:#fff;' : 'background:none;color:#999;');
  document.getElementById('authErr').style.display = 'none';
}

function showErr(msg) {
  var e = document.getElementById('authErr');
  e.textContent = msg; e.style.display = msg ? 'block' : 'none';
}

function openApp(name) {
  document.getElementById('authScreen').style.display = 'none';
  document.body.classList.add('authed');
  // Load the app
  var s = document.createElement('script');
  s.src = 'script.js?v=1790921643';
  s.onload = function() { if(typeof initApp==='function') initApp(); };
  document.body.appendChild(s);
}

function doLogin() {
  var email = document.getElementById('lEmail').value.trim();
  var pwd   = document.getElementById('lPwd').value;
  if(!email||!pwd){ showErr('Remplissez votre email et mot de passe.'); return; }
  var users = JSON.parse(localStorage.getItem('bs_users')||'[]');
  var found = null;
  for(var i=0;i<users.length;i++){
    if(users[i].email===email && users[i].pwd===btoa(unescape(encodeURIComponent(pwd)))){ found=users[i]; break; }
  }
  if(!found){ showErr('Email ou mot de passe incorrect.'); return; }
  localStorage.setItem('bs_local_user', JSON.stringify({id:found.id,email:email,user_metadata:{name:found.name}}));
  openApp(found.name);
}

function doSignup() {
  var name  = document.getElementById('sName').value.trim();
  var email = document.getElementById('sEmail').value.trim();
  var pwd   = document.getElementById('sPwd').value;
  if(!name){ showErr('Entrez votre prénom.'); return; }
  if(!email){ showErr('Entrez votre email.'); return; }
  if(!pwd||pwd.length<6){ showErr('Mot de passe minimum 6 caractères.'); return; }
  var users = JSON.parse(localStorage.getItem('bs_users')||'[]');
  for(var i=0;i<users.length;i++){ if(users[i].email===email){ showErr('Email déjà utilisé. Connectez-vous.'); return; } }
  var id = 'local_'+Date.now();
  users.push({id:id,email:email,name:name,pwd:btoa(unescape(encodeURIComponent(pwd)))});
  localStorage.setItem('bs_users', JSON.stringify(users));
  localStorage.setItem('bs_local_user', JSON.stringify({id:id,email:email,user_metadata:{name:name}}));
  openApp(name);
}

// Auto-login if session exists
var existing = localStorage.getItem('bs_local_user');
if(existing){ try{ JSON.parse(existing); openApp(''); } catch(e){ localStorage.removeItem('bs_local_user'); } }
</script>
</body>
</html>
